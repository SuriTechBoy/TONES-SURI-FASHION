<script data-cfasync="false">
  document.documentElement.classList.add('tracking-page-booting');

  function finishTrackingPageBoot() {
    window.requestAnimationFrame(function() {
      document.documentElement.classList.remove('tracking-page-booting');
    });
  }

  function hideMobileReturnToStoreText() {
    if (!window.matchMedia('(max-width: 768px)').matches) {
      return;
    }

    window.setTimeout(function() {
      document.querySelectorAll('.return-to-store-link').forEach(function(element) {
        element.classList.add('is-mobile-hidden');
      });
    }, 2000);
  }

  if (document.readyState === 'loading') {
    window.addEventListener('DOMContentLoaded', function() {
      finishTrackingPageBoot();
      hideMobileReturnToStoreText();
    }, { once: true });
  } else {
    finishTrackingPageBoot();
    hideMobileReturnToStoreText();
  }
</script>

    border-radius: inherit;
    animation: trackingTimelineRipple 1.8s ease-out infinite;
    pointer-events: none;

    border-color: #16ac37;

  }

  @keyframes trackingTimelineRipple {
    0% {

    }
    75%,

    function setupAnnouncementBanners() {
      var speedIntervals = {
        slow: 5000,
        normal: 3500,
        fast: 2500
      };
      var marqueeScale = {
        slow: 0.42,
        normal: 0.32,
        fast: 0.22
      };

      $('.tracking-announcement-banner').each(function() {
        var banner = this;
        var storageKey = banner.getAttribute('data-banner-storage-key');
        if (storageKey && window.sessionStorage && sessionStorage.getItem(storageKey) === 'hidden') {
          banner.style.display = 'none';
          return;
        }

        var animation = banner.getAttribute('data-banner-animation');
        var speed = banner.getAttribute('data-banner-speed') || 'normal';
        var messages = banner.querySelectorAll('.tracking-announcement-banner__message:not([aria-hidden="true"])');
        var closeBtn = banner.querySelector('.tracking-announcement-banner__close');
        if (closeBtn) {
          closeBtn.addEventListener('click', function() {
            if (storageKey && window.sessionStorage) {
              sessionStorage.setItem(storageKey, 'hidden');
            }
            banner.style.display = 'none';
          });
        }

        if (animation === 'marquee_left') {
          var textLength = banner.textContent.trim().length || 40;
          var duration = Math.max(10, Math.ceil(textLength * (marqueeScale[speed] || marqueeScale.normal)));
          banner.style.setProperty('--tracking-banner-duration', duration + 's');
          return;
        }

        if (messages.length <= 1 || animation === 'marquee_left' || window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          return;
        }

        var activeIndex = 0;
        var interval = window.setInterval(function() {
          messages[activeIndex].classList.remove('is-active');
          activeIndex = (activeIndex + 1) % messages.length;
          messages[activeIndex].classList.add('is-active');
          banner.setAttribute('data-banner-message-index', activeIndex);
        }, speedIntervals[speed] || speedIntervals.normal);

        banner.addEventListener('mouseenter', function() {
          window.clearInterval(interval);
        });
        banner.addEventListener('mouseleave', function() {
          interval = window.setInterval(function() {
            messages[activeIndex].classList.remove('is-active');
            activeIndex = (activeIndex + 1) % messages.length;
            messages[activeIndex].classList.add('is-active');
            banner.setAttribute('data-banner-message-index', activeIndex);
          }, speedIntervals[speed] || speedIntervals.normal);
        });
      });
    }

    function setupFixedBannerOffset() {
      var banner = document.querySelector('.tracking-announcement-banner--top_fixed');
      function syncOffset() {
        var height = banner && banner.style.display !== 'none'
          ? Math.ceil(banner.getBoundingClientRect().height)
          : 0;
        document.body.classList.toggle('has-tracking-top-fixed-banner', height > 0);
        document.body.style.setProperty('--tracking-fixed-banner-offset', height + 'px');
      }
      syncOffset();
      window.addEventListener('resize', syncOffset);
      if (!banner) {
        return;
      }
      var closeButton = banner.querySelector('.tracking-announcement-banner__close');
      if (closeButton) {
        closeButton.addEventListener('click', function() {
          window.requestAnimationFrame(syncOffset);
        });
      }
      if (window.ResizeObserver) {
        new ResizeObserver(syncOffset).observe(banner);
      }
    }

    function escapeRecommendationHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function setupAutoRecommendedProductsCarousel(root) {
      if (!root || root.dataset.autoCarouselInitialized === 'true') {
        return;
      }
      if (root.dataset.displayMode !== 'carousel' || root.dataset.carouselScrollMode !== 'auto') {
        return;
      }
      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        return;
      }
      var viewport = root.querySelector('.tracking-recommended-products__viewport');
      if (!viewport) {
        return;
      }
      root.dataset.autoCarouselInitialized = 'true';
      var timer = null;
      var advance = function() {
        var maxLeft = viewport.scrollWidth - viewport.clientWidth;
        if (maxLeft <= 1) {
          return;
        }
        var step = Math.max(viewport.clientWidth * 0.85, 240);
        if (viewport.scrollLeft >= maxLeft - 4) {
          viewport.scrollTo({ left: 0, behavior: 'smooth' });
        } else {
          viewport.scrollTo({
            left: Math.min(viewport.scrollLeft + step, maxLeft),
            behavior: 'smooth'
          });
        }
      };
      var stop = function() {
        if (timer) {
          window.clearInterval(timer);
          timer = null;
        }
      };
      var start = function() {
        stop();
        if (!document.hidden) {
          timer = window.setInterval(advance, 4000);
        }
      };
      root.addEventListener('mouseenter', stop);
      root.addEventListener('mouseleave', start);
      root.addEventListener('focusin', stop);
      root.addEventListener('focusout', function() {
        window.setTimeout(function() {
          if (!root.contains(document.activeElement)) {
            start();
          }
        }, 0);
      });
      document.addEventListener('visibilitychange', function() {
        if (document.hidden) {
          stop();
        } else {
          start();
        }
      });
      start();
    }

    function loadLoginRecommendations() {
      var section = document.getElementById('centeredLoginRecommendedProducts');
      if (!section) {
        return;
      }
      var url = section.getAttribute('data-recommendations-url');
      var localMerchantId = section.getAttribute('data-merchant-id');
      var sharedTrackingMid = getParameterByName('mid');
      if (sharedTrackingMid) {
        url += (url.indexOf('?') === -1 ? '?' : '&') + 'mid=' + encodeURIComponent(sharedTrackingMid);
      } else if (localMerchantId && window.location.hostname === 'localhost') {
        url += (url.indexOf('?') === -1 ? '?' : '&') + 'merchant_id=' + encodeURIComponent(localMerchantId);
      }
      fetch(url, { credentials: 'same-origin' })
        .then(function(response) {
          if (!response.ok) {
            throw new Error('Recommendations unavailable');
          }
          return response.json();
        })
        .then(function(payload) {
          var products = payload && Array.isArray(payload.products) ? payload.products : [];
          if (!payload || !payload.enabled || !products.length) {
            section.remove();
            return;
          }
          var cards = products.map(function(product) {
            var cardTag = product.url ? 'a' : 'div';
            var linkAttributes = product.url
              ? ' href="' + escapeRecommendationHtml(product.url) + '" target="_blank" rel="noopener noreferrer"'
              : '';
            var image = product.image
              ? '<img class="tracking-recommended-product__image" src="' + escapeRecommendationHtml(product.image) + '" alt="' + escapeRecommendationHtml(product.title) + '" loading="lazy">'
              : '<div class="tracking-recommended-product__placeholder" aria-hidden="true">' + escapeRecommendationHtml(String(product.title || 'P').charAt(0)) + '</div>';
            return '<' + cardTag + ' class="tracking-recommended-product"' + linkAttributes + '>' +
              '<div class="tracking-recommended-product__image-wrap">' + image + '</div>' +
              '<div class="tracking-recommended-product__body">' +
                '<div class="tracking-recommended-product__title">' + escapeRecommendationHtml(product.title) + '</div>' +
                (product.price_label ? '<div class="tracking-recommended-product__price">' + escapeRecommendationHtml(product.price_label) + '</div>' : '') +
                (product.variant_label ? '<div class="tracking-recommended-product__variants">' + escapeRecommendationHtml(product.variant_label) + '</div>' : '') +
              '</div></' + cardTag + '>';
          }).join('');
          var displayMode = payload.display_mode === 'grid' ? 'grid' : 'carousel';
          var carouselScrollMode = payload.carousel_scroll_mode === 'auto' ? 'auto' : 'manual';
          section.innerHTML = '<div class="tracking-recommended-products tracking-recommended-products--' + displayMode + '" data-display-mode="' + displayMode + '" data-carousel-scroll-mode="' + carouselScrollMode + '">' +
            '<div class="tracking-recommended-products__header">' +
              '<h2 class="tracking-recommended-products__title font-google">' + escapeRecommendationHtml(payload.title || 'Recommended products') + '</h2>' +
              (displayMode === 'carousel' && products.length > 1 ? '<div class="tracking-recommended-products__controls"><button type="button" class="tracking-recommended-products__button" data-products-scroll="prev" aria-label="Previous recommended products">&#8249;</button><button type="button" class="tracking-recommended-products__button" data-products-scroll="next" aria-label="Next recommended products">&#8250;</button></div>' : '') +
            '</div><div class="tracking-recommended-products__viewport"><div class="tracking-recommended-products__track">' + cards + '</div></div></div>';
          var viewport = section.querySelector('.tracking-recommended-products__viewport');
          section.querySelectorAll('[data-products-scroll]').forEach(function(button) {
            button.addEventListener('click', function() {
              var direction = button.getAttribute('data-products-scroll') === 'prev' ? -1 : 1;
              viewport.scrollBy({ left: direction * Math.max(viewport.clientWidth * 0.85, 240), behavior: 'smooth' });
            });
          });
          setupAutoRecommendedProductsCarousel(section.querySelector('.tracking-recommended-products'));
        })
        .catch(function() {
          section.remove();
        });
    }

    setupAnnouncementBanners();
    setupFixedBannerOffset();
    loadLoginRecommendations();
    document.querySelectorAll('.tracking-recommended-products').forEach(setupAutoRecommendedProductsCarousel);

    // OTP Input Logic
    $('.otp-input').on('input', function() {

    function validateLoginContact($input, contactValue) {
      var loginMethod = $input.data('login-method') || 'any';
      var errorMessage = '';
      if (!contactValue) {
        errorMessage = loginMethod === 'email'
          ? 'Please provide your email address.'
          : loginMethod === 'phone'
            ? 'Please provide your phone number.'
            : 'Please provide your phone number or email id.';
      } else if (loginMethod === 'email' && $input[0] && !$input[0].checkValidity()) {
        errorMessage = 'Please enter a valid email address.';
      } else if (loginMethod === 'phone') {
        var phoneDigits = contactValue.replace(/\D/g, '');
        if (phoneDigits.length < 10 || phoneDigits.length > 15) {
          errorMessage = 'Please enter a valid phone number.';
        }
      }

      var $help = $input.siblings('#contactHelp');
      $input.toggleClass('border border-danger', Boolean(errorMessage));
      $help
        .toggleClass('text-muted', !errorMessage)
        .toggleClass('text-danger', Boolean(errorMessage))
        .text(errorMessage || $help.data('default-text'));
      return !errorMessage;
    }

    function setResendOtpState(enabled, label) {

          'opacity': enabled ? '1' : '0.6'

    function startOtpCooldown(seconds) {
      otpCooldownRemaining = parseInt(seconds || otpCooldownSeconds, 10);
      if (otpCooldownTimer) {
        clearInterval(otpCooldownTimer);
      }
      setResendOtpState(false, 'Resend OTP in ' + otpCooldownRemaining + 's');
      otpCooldownTimer = setInterval(function() {
        otpCooldownRemaining -= 1;
        if (otpCooldownRemaining <= 0) {
          clearInterval(otpCooldownTimer);
          otpCooldownTimer = null;
          otpCooldownRemaining = 0;
          setResendOtpState(true, 'Resend OTP');
          return;
        }
        setResendOtpState(false, 'Resend OTP in ' + otpCooldownRemaining + 's');
      }, 1000);
    }

    function sendOrderTrackingOtp(btn, loaderText) {
      var contactValue = getContactValue();
      var $activeInput = getActiveContactInput();
      var isResend = $(btn).attr('id') === 'resendOtpLink';
      if (isResend && otpCooldownRemaining > 0) {
        return;
      }
      if (!validateLoginContact($activeInput, contactValue)) {
        return;
      }
      contact = contactValue;
      if (isResend) {
        setResendOtpState(false, loaderText);
      } else {
        var defaultButtonLabel = getTrackingButtonDefaultLabel(btn);
        showLoader(btn, loaderText);
      }
      post_with_csrf(
        url=$('#sendOtpAPI').val(),
        data={
          mid: merchantId,
          contact: contactValue
        },
        success=function(data) {
          if (data.success) {
          //   $('#orderFormSection').removeClass('show-order-list');
          //   $('.parent-wrapper').removeClass('show-order-list');

            // Hide Login State, Show OTP State
            $('[id="loginState"]').hide();
            $('[id="otpSection"]').css('display', 'flex'); // Use flex for centering logic
            $('[id="otpSentTo"]').text(contactValue);
            $('.otp-input').val('');
            startOtpCooldown((data.data && data.data.cooldown_seconds) || otpCooldownSeconds);

            $('#orderListSection').hide();
            $('#orderListContainer').empty();
            updateOrderTrackingMessage('', false);

            // Focus first OTP input
            setTimeout(function(){ $('#otp-1').focus(); }, 100);

          } else {
            if (isResend) {
              setResendOtpState(true, 'Resend OTP');
            }
            updateOrderTrackingMessage(data.error.message || 'Unable to send OTP.', true);
          }
        },
        error=function(err) {
          var response = err.responseJSON || {};
          var message = (response.error && response.error.message) || 'Unable to send OTP.';
          if (response.error && response.error.cooldown_seconds) {
            startOtpCooldown(response.error.cooldown_seconds);
          } else if (isResend) {
            setResendOtpState(true, 'Resend OTP');
          }
          updateOrderTrackingMessage(message, true);
        },
        complete=function() {
          if (!isResend) {
            restoreTrackingButton(btn, defaultButtonLabel);
          }
        }
      );
    }

    $('#sendOtpBtn').click(function () {
      sendOrderTrackingOtp(this, 'Sending OTP...');
    });

    $(document).on('click', '#resendOtpLink', function() {
      sendOrderTrackingOtp(this, 'Resending OTP...');
    });

    $('#verifyOtpBtn').click(function () {
      var btn = this;
      var defaultButtonLabel = getTrackingButtonDefaultLabel(btn);

      // Concatenate OTP inputs
      var otpValue = '';
      $('.otp-input').each(function() {
          otpValue += $(this).val();
      });

      if (otpValue.length < 6) {
         updateOrderTrackingMessage('Please enter a valid 6-digit OTP', true);
         return;
      }

      if (!contact) {
          // Fallback if contact var is lost, though it shouldn't be
           var splitContact = $('.login-section.split-view #contact').val();
           var fullContact = $('.login-section.overlay-view #contact').val();
           contact = (splitContact || fullContact || '').trim();
      }

      showLoader(btn, 'Verifying...');
      post_with_csrf(
        url=$('#verifyOtpAPI').val(),
        data={
          mid: merchantId,
          contact: contact,
          otp: otpValue
        },
        success=function(data) {
          if (data.success) {
            $('[id="otpSection"]').hide(); // Hide OTP section
            $('#orderListSection').show();
            renderOrderList(data.data.orders || []);
            $('#orderFormSection').addClass('show-order-list');
            $('.parent-wrapper').addClass('show-order-list');
            updateOrderTrackingMessage('', false);
          } else {
            updateOrderTrackingMessage(data.error.message || 'Unable to verify OTP.', true);
          }
        },
        error=function(err) {
          var response = err.responseJSON || {};
          var message = (response.error && response.error.message) || 'Unable to verify OTP.';
          updateOrderTrackingMessage(message, true);
        },
        complete=function() {
          restoreTrackingButton(btn, defaultButtonLabel);
        }
      );
    });


    $('#saveNPS').click(function() {
      var btn = this;
      showLoader(btn, 'Submitting...');

      var netPromoterScore = parseInt($('input[name="nps"]:checked').val());
      if (!(netPromoterScore >=0 && netPromoterScore <=10)) {
        alertMessage(
          'Please select a score before submitting your feedback.',
          title='Error!',
          icon=swalIcons.error);
        hideLoader(btn, 'Submit');
        return;
      };

      post_with_csrf(
        url=$('#submitNPSAPI').val(),
        data={
          mid: merchantId,
          order: orderNumber,
          net_promoter_score: netPromoterScore,
          nps_comment: $('#npsComment').val(),
          nps_source: source
        },
        success=function(data) {
          if (data.success) {
            alertMessage(
              'We really appreciate you taking time to provide your valuable feedback.',
              title='Thank you!',
              icon=swalIcons.success);
          } else {
            alertMessage(
              'Oops! Something went wrong. Please try again.',
              title='Error!',
              icon=swalIcons.error);
          }
        },
        error=function(err) {
          alertMessage(
            'Oops! Something went wrong. Please try again.',
            title='Error!',
            icon=swalIcons.error);
        },
        complete=function() {
          hideLoader(btn, 'Submit');
        }
      );
    });
  });
</script>


   
   

</html>
